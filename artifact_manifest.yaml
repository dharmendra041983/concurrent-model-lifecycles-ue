paper:
  title: "Concurrent Model Lifecycles at the UE: Interaction Between Beam Management, CSI Prediction, and CSI Compression"
  author: "Dharmendra Kumar"
  target_venue: "IEEE Transactions on Wireless Communications"
  artifact_version: "1.0.1"

artifacts:
  - paper_item: "Table I - training configuration"
    source_script: "src/train.py"
    config: "src/config.py"
  - paper_item: "Table II - held-out model validation"
    source_script: "src/train.py"
    validation_n: 128
  - paper_item: "Table III - correlated monitor firing"
    source_scripts: ["src/nominal_corr.py", "src/induced.py"]
    calibration_n: 64
    nominal_evaluation_n: 512
    blocked_n: 256
  - paper_item: "Table IV and Fig. 2 - fallback interaction"
    source_script: "src/experiment.py"
    n: 512
  - paper_item: "Table V - induced fallback"
    source_script: "src/induced.py"
    n: 256
    q_exit: 25
  - paper_item: "Table VI and Fig. 3 - conditional fallback value"
    source_script: "src/conditional.py"
    n: 256
  - paper_item: "Table VII - compression monitor / encoder mechanism diagnostic"
    source_script: "src/mechanism.py"
    n: 64
  - paper_item: "Table VIII - encoder rate-robustness sweep"
    source_script: "src/check_encoder_ood.py"
    n: 64
  - paper_item: "Table IX - dependency-aware vs blind-delay arbitration"
    source_script: "src/arbiter.py"
    n: 256
    W_a: 10
  - paper_item: "Table X - pairing-mismatch severity sweep"
    source_scripts: ["src/train_pair.py", "src/pairing.py", "src/arbiter_mismatch.py"]
    fr2_n: 512
    fr1_n: 128
